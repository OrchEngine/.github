name: Feature request
description: Propose new functionality or a meaningful improvement.
title: "[Feature]: "
type: Feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve, and who has it?
      placeholder: Today I cannot ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the behavior or interface you want.
      placeholder: When I ... I expect ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or prior art.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know this is done?
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: false

name: Task
description: Track maintenance, docs, quality, tooling, or a gate.
title: "[Task]: "
type: Task
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is complete?
      placeholder: Describe the outcome, not just the activity.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included, and what is explicitly out of scope?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Concrete checks that prove the task is done.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Links, dependencies, risks, or related issues.
    validations:
      required: false
